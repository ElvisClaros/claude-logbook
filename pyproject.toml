[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-sesiones"
description = "Explorador de las sesiones de Claude Code: tabla en la terminal y página HTML autocontenida."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Elvis Claros Castro" }]
keywords = ["claude", "claude-code", "cli", "jsonl", "sessions", "transcripts"]
dynamic = ["version"]
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ElvisClaros/claude-sesiones"
Issues = "https://github.com/ElvisClaros/claude-sesiones/issues"

[project.scripts]
claude-sesiones = "claude_sesiones.cli:main"

[tool.setuptools]
packages = ["claude_sesiones"]

[tool.setuptools.dynamic]
version = { attr = "claude_sesiones.__version__" }

[tool.setuptools.package-data]
claude_sesiones = ["template.html"]
