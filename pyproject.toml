[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-logbook"
description = "Browse your Claude Code sessions and project memories: a terminal table and a self-contained HTML page."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Elvis Claros Castro" }]
keywords = ["claude", "claude-code", "cli", "jsonl", "sessions", "transcripts",
            "memory", "logbook"]
dynamic = ["version"]
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ElvisClaros/claude-logbook"
Issues = "https://github.com/ElvisClaros/claude-logbook/issues"

[project.scripts]
claude-logbook = "claude_logbook.cli:main"

[tool.setuptools]
packages = ["claude_logbook"]

[tool.setuptools.dynamic]
version = { attr = "claude_logbook.__version__" }

[tool.setuptools.package-data]
claude_logbook = ["template.html"]
