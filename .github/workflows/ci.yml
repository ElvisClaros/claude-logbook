name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependencies on purpose: if installing something is ever needed
      # to run the tests, the project is no longer stdlib-only.
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Installs and the command starts
        run: |
          pip install .
          claude-logbook --version
          claude-logbook --help
